<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    h1, h2 {
      color: #333;
    }
    .endpoint {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 15px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
    }
    pre {
      background-color: #f5f5f5;
      padding: 10px;
      border-radius: 5px;
      overflow: auto;
      max-height: 200px;
    }
  </style>
</head>
<body>
  <h1>BookBrust API Test</h1>
  <p>This page tests direct API connections to ensure the endpoints are working correctly.</p>
  
  <div class="endpoint">
    <h2>Health Check</h2>
    <button onclick="testEndpoint('/health-check')">Test Health Check</button>
    <pre id="health-check-result">No results yet</pre>
  </div>
  
  <div class="endpoint">
    <h2>Dashboard Stats</h2>
    <button onclick="testEndpoint('/user-books/dashboard-stats')">Test Dashboard Stats</button>
    <pre id="dashboard-stats-result">No results yet</pre>
  </div>
  
  <div class="endpoint">
    <h2>Books</h2>
    <button onclick="testEndpoint('/books')">Test Books</button>
    <pre id="books-result">No results yet</pre>
  </div>
  
  <div class="endpoint">
    <h2>Trending Books</h2>
    <button onclick="testEndpoint('/books/trending')">Test Trending Books</button>
    <pre id="trending-books-result">No results yet</pre>
  </div>
  
  <div class="endpoint">
    <h2>Last Reading Book</h2>
    <button onclick="testEndpoint('/user-books/last-reading')">Test Last Reading Book</button>
    <pre id="last-reading-result">No results yet</pre>
  </div>
  
  <div class="endpoint">
    <h2>Reading Challenge</h2>
    <button onclick="testEndpoint('/reading-challenges/current')">Test Current Challenge</button>
    <pre id="current-challenge-result">No results yet</pre>
  </div>

  <script>
    const API_URL = 'http://localhost:9090';
    
    async function testEndpoint(endpoint) {
      const resultId = endpoint.replace(/\//g, '-').slice(1) + '-result';
      const resultElement = document.getElementById(resultId);
      
      if (!resultElement) {
        console.error(`No element found with ID: ${resultId}`);
        return;
      }
      
      resultElement.textContent = 'Loading...';
      
      try {
        console.log(`Testing endpoint: ${API_URL}${endpoint}`);
        const response = await fetch(`${API_URL}${endpoint}`);
        const data = await response.json();
        
        resultElement.textContent = JSON.stringify(data, null, 2);
        console.log(`Endpoint ${endpoint} success:`, data);
      } catch (error) {
        resultElement.textContent = `Error: ${error.message}`;
        console.error(`Endpoint ${endpoint} error:`, error);
      }
    }
  </script>
</body>
</html>
