version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
  customHeaders:
    - pattern: "**/*"
      headers:
        - key: Cache-Control
          value: "max-age=0, no-cache, no-store, must-revalidate"
        - key: Access-Control-Allow-Credentials
          value: "true"
  cookies:
    - name: connect.sid
      path: /
      httpOnly: true
      secure: true
      sameSite: none
      ttl: 86400 # 24 hours